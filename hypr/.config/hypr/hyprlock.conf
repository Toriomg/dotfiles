source = /home/$USER/.cache/wal/colors-hyprland

background {
    monitor =
    path = $wallpaper
    blur_size = 5
    blur_passes = 3
    brightness = .55
}

# Time — single HH:MM, clean, foreground color
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $color7
    font_size = 96
    font_family = SF Pro Text
    position = 0, 110
    halign = center
    valign = center
}

# Date — small and muted, just below the time
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $color8
    font_size = 14
    font_family = SF Pro Text
    position = 0, 42
    halign = center
    valign = center
}

# Input field — minimal pill, no placeholder text
input-field {
    monitor =
    size = 240, 44
    outline_thickness = 1
    dots_rounding = -1
    dots_spacing = 0.35
    dots_center = true
    inner_color = $backgroundCol
    outer_color = $color9
    capslock_color = rgba(220, 70, 70, 1.0)
    check_color = $color9
    fail_color = rgba(220, 70, 70, 1.0)
    font_color = $color9
    font_family = SF Pro Text
    fade_on_empty = false
    rounding = 99
    placeholder_text =
    fail_text = wrong password
    fail_timeout = 2000
    position = 0, -80
    halign = center
    valign = center
}

# Caps lock warning — only renders text when active
label {
    monitor =
    text = cmd[update:200] bash -c 'b=$(cat /sys/class/leds/*capslock*/brightness 2>/dev/null | head -1); [[ "$b" == "1" ]] && echo "󰌌  CAPS LOCK" || echo ""'
    color = rgba(220, 70, 70, 1.0)
    font_size = 12
    font_family = SF Pro Text
    position = 0, -135
    halign = center
    valign = center
}
