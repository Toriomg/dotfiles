[[mgr.prepend_keymap]]
on   = [ "g", "p" ]
run  = "cd ~/Projects"
desc = "Ir a la carpeta de Proyectos"

[[mgr.prepend_keymap]]
on   = [ "g", "d" ]
run  = "cd ~/Documentos/"
desc = "Ir a Documentos"

[[mgr.prepend_keymap]]
on   = [ "g", "D" ]
run  = "cd ~/Descargas"
desc = "Ir a Descargas"

[[mgr.prepend_keymap]]
on   = [ "g", "c" ]
run  = "cd ~/code"
desc = "Ir a Code"

[[mgr.prepend_keymap]]
on   = [ "g", "C" ]
run  = "cd ~/.config"
desc = "Ir a config"
